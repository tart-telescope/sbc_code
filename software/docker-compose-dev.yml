### Local development / testing environment for the TART telescope API.
#
# Builds the API from local source (no prebuilt image) and runs without
# telescope hardware (SPI), so it works on a desktop. The repo's
# telescope_config.json and calibrated_antenna_positions.json are mounted
# into the container.
#
#   API docs:  http://localhost:8000/docs
#   Web UI:    http://localhost:8080
#   Login:     admin / password (LOGIN_PW below)
#
# Usage:
#   docker compose -f docker-compose-dev.yml up --build
#   docker compose -f docker-compose-dev.yml down -v

services:
  telescope-api:
    build:
      context: ./containers/telescope_api
      dockerfile: Dockerfile
      target: runtime
    container_name: telescope-api-dev
    ports:
      - "8000:5000"
    environment:
      - LOGIN_PW=password
      - SECRET_KEY=super-secret-123897219379179464asd13khk213
      - LOGLEVEL=DEBUG
    volumes:
      - ./containers/telescope_api/tart_api:/app:rw # live source for dev
      - ./containers/telescope_api/hardware_interface:/hardware_interface:ro
      - ./telescope_config.json:/config_data/telescope_config.json
      - ./calibrated_antenna_positions.json:/config_data/calibrated_antenna_positions.json
      - telescope_data:/telescope_data
    restart: unless-stopped
    networks:
      - tart-network

  ui:
    image: ghcr.io/tart-telescope/web_app/viewer-root:main
    volumes:
      - ./containers/telescope_api/nginx.conf:/etc/nginx/nginx.conf:ro
      - telescope_data:/telescope_data:ro
    ports:
      - "8080:80"
    networks:
      - tart-network
    depends_on:
      - telescope-api

volumes:
  # Mounted on each container as /telescope_data, used for raw data and vis data. This is a hardcoded path in each container.
  telescope_data:
    driver: local

networks:
  tart-network:
    driver: bridge
