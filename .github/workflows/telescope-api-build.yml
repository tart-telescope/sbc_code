name: Build Telescope API
# https://dev.to/pradumnasaraf/publishing-multi-arch-docker-images-to-ghcr-using-buildx-and-github-actions-2k7j
on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  NAMESPACE: tart-telescope
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Issue #25: build the linux/arm64 variant first and boot it before any
      # image is published, so a broken/mis-built base image (illegal
      # instructions on ARMv8.0, venv/interpreter skew, broken imports) is
      # caught in CI instead of crashing in the field. NOTE: QEMU emulates a
      # CPU newer than ARMv8.0, so this is a gross-breakage gate only; the
      # authoritative ARMv8.0 check is the manual smoke test on a Raspberry Pi
      # 4 (see issue #25).
      - name: Build arm64 smoke-test image
        uses: docker/bake-action@v5
        with:
          workdir: ./software/containers/telescope_api
          targets: image-smoke
          files: |
            ./docker-bake.hcl
        env:
          GIT_COMMIT: ${{ github.sha }}

      - name: Smoke test arm64 image (issue #25)
        run: |
          docker run --rm --platform linux/arm64 telescope-api:smoke \
            python -X faulthandler -c "import gc, ensurepip, pydantic.fields, fastapi, app.main; [gc.collect() for _ in range(20)]; print('smoke ok')"

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/bake-action@v5
        with:
          workdir: ./software/containers/telescope_api
          targets: image-cross
          push: true
          files: |
            ./docker-bake.hcl
            ${{ steps.meta.outputs.bake-file }}
        env:
          GIT_COMMIT: ${{ github.sha }}
